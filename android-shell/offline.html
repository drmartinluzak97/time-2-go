<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>time2go – offline</title>
<style>
  :root { --bg: #f4f6f8; --text: #15191e; --muted: #5f6b7a; --accent: #0b6bcb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1013; --text: #e8ecf1; --muted: #97a3b2; --accent: #4da3ff; } }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Roboto, sans-serif;
         display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 4px 0; }
  button { margin-top: 24px; border: 0; background: var(--accent); color: #fff; font-weight: 700; font-size: 16px;
           padding: 12px 28px; border-radius: 10px; }
  .logo { font-size: 28px; font-weight: 800; }
  .logo span { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="logo">time<span>2</span>go</div>
  <h1 id="h">Ste offline</h1>
  <p id="p">Na vyhľadávanie spojení je potrebné pripojenie na internet.</p>
  <button id="b" onclick="location.href='https://time-2-go.vercel.app'">Skúsiť znova</button>
</main>
<script>
  var t = {
    cs: ["Jste offline", "K vyhledávání spojení je potřeba připojení k internetu.", "Zkusit znovu"],
    hu: ["Nincs internetkapcsolat", "A kereséshez internetkapcsolat szükséges.", "Újra"],
    pl: ["Jesteś offline", "Do wyszukiwania połączeń potrzebne jest połączenie z internetem.", "Spróbuj ponownie"],
    de: ["Sie sind offline", "Für die Verbindungssuche ist eine Internetverbindung nötig.", "Erneut versuchen"],
    en: ["You are offline", "An internet connection is needed to search for connections.", "Try again"],
    uk: ["Немає з'єднання", "Для пошуку маршрутів потрібне підключення до інтернету.", "Спробувати ще раз"]
  };
  var l = (navigator.language || "sk").slice(0, 2).toLowerCase();
  if (l === "cz") l = "cs";
  if (t[l]) {
    document.documentElement.lang = l;
    document.getElementById("h").textContent = t[l][0];
    document.getElementById("p").textContent = t[l][1];
    document.getElementById("b").textContent = t[l][2];
  }
</script>
</body>
</html>
